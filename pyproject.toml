[project]
name = "secreview-spike"
version = "0.0.0"
description = "Reproducible framework for machine-verifiable security review evidence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "mcp>=1.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
