<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">RD v2 security-review pipeline results</title>
  <desc id="desc">Entry discovery three of five, behavior discovery two of five, fully verified chains zero of five, correct attribution three of five, and false support zero of two negative-control revisions.</desc>
  <rect width="980" height="390" rx="16" fill="#f8fafc"/>
  <text x="48" y="50" fill="#0f172a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">RD v2 pipeline success</text>
  <text x="48" y="78" fill="#475569" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Fresh measurement · 5 real security fixes · descriptive results</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">
    <text x="48" y="125" fill="#1e293b" font-weight="600">Entry discovery</text>
    <rect x="260" y="108" width="500" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="260" y="108" width="300" height="22" rx="6" fill="#2563eb"/>
    <text x="785" y="125" fill="#0f172a" font-weight="700">3/5</text>

    <text x="48" y="175" fill="#1e293b" font-weight="600">Behavior discovery</text>
    <rect x="260" y="158" width="500" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="260" y="158" width="200" height="22" rx="6" fill="#2563eb"/>
    <text x="785" y="175" fill="#0f172a" font-weight="700">2/5</text>

    <text x="48" y="225" fill="#1e293b" font-weight="600">Fully verified chain</text>
    <rect x="260" y="208" width="500" height="22" rx="6" fill="#e2e8f0"/>
    <line x1="261" y1="209" x2="261" y2="229" stroke="#dc2626" stroke-width="3"/>
    <text x="785" y="225" fill="#991b1b" font-weight="700">0/5</text>

    <text x="48" y="275" fill="#1e293b" font-weight="600">Correct attribution</text>
    <rect x="260" y="258" width="500" height="22" rx="6" fill="#e2e8f0"/>
    <rect x="260" y="258" width="300" height="22" rx="6" fill="#2563eb"/>
    <text x="785" y="275" fill="#0f172a" font-weight="700">3/5</text>
  </g>

  <rect x="48" y="310" width="884" height="44" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="72" cy="332" r="6" fill="#059669"/>
  <text x="91" y="337" fill="#065f46" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="650">Negative-control false support: 0/2 revisions</text>
  <text x="700" y="380" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">Small sample; no population claim.</text>
</svg>
