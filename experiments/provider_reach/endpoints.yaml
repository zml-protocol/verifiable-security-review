# Expressibility, decided from each provider's output schema before any run on
# these fixtures (Trailmark: schema observed on synthetic-notes only).
expressible:
  trailmark-0.5.0:     # function nodes with line spans; `calls` edges carry no call-site location
    call_typed_attribute: false   # function-level only; line-level call sites not representable
    registry_dispatch: false
    guard_property: false
    object_composition: false
    field_flow: false
  codeql-2.27.1-taint-path:   # the single frozen generic taint path query per language
    # `calibrate`: decided by the non-evaluation calibration pilot (pilot.yaml) with the
    # query unchanged, recorded in results/spike-p-calibration.json before any evaluation run
    call_typed_attribute: calibrate
    registry_dispatch: calibrate   # keyed selection is control, not value derivation
    guard_property: false          # a sibling field of an object on the flow is not on the flow
    object_composition: calibrate
    field_flow: calibrate
