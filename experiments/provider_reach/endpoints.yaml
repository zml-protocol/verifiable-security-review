# Spike P (PREREGISTRATION.md §9): directed reachability endpoints and relation types.
#
# Endpoints are the only fixture-specific input a provider receives. By the
# frozen rule they are the case.yaml hint entry, the golden flip location, or
# the entry function's own externally visible output. Golden intermediate
# locations never appear here; they are only read by the scorer.
#
# A variable name narrows an endpoint to one node on that line; "*" takes
# every data-flow node that starts on it.

relations:
  # id: what the link is; frozen before any provider runs on these fixtures
  call_typed_attribute: method call on an attribute whose type is set elsewhere
  registry_dispatch: callee chosen at run time from a registry keyed by input data
  guard_property: condition that is a property of an object on the path, not on the flow
  object_composition: object stored into a field or collection of another object
  field_flow: value flowing through locals into a struct field

fixtures:
  authlib-jws-none:
    language: python
    repo: .cache/repos/authlib.git
    commits: {base: 21f7f50820f3906cebad308b35c816abf746ec3d, head: a61c2acb807496e67f32051b5f1b1d5ccf8f0a75}
    build: null
    path_fact: decode-reaches-verify          # golden ids <side>-decode-reaches-verify
    endpoints:                                 # identical lines on both sides
      base: &authlib
        source: {file: authlib/jose/rfc7519/jwt.py, line: 80, name: s, why: "hint entry JsonWebToken.decode, token parameter"}
        sink: {file: authlib/jose/rfc7518/jws_algs.py, line: 37, name: sig, why: "golden flip NoneAlgorithm.verify, signature parameter"}
      head: *authlib
    locations:                                 # golden path-fact locations -> relation type
      - {file: authlib/jose/rfc7519/jwt.py, lines: 104, relation: call_typed_attribute}
      # anchors: the registry selection (106) and the dispatched call (107) must both be
      # on the path; touching the span alone (e.g. only 109) does not recover the dispatch
      - {file: authlib/jose/rfc7515/jws.py, lines: 106-109, anchors: [106, 107], relation: registry_dispatch}

